<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trending Footwear Visual Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-50 p-8 flex flex-col items-center gap-8 font-sans">
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6 w-full">
    <!-- HEADER & FILTER TABS -->
    <div class="flex flex-col md:flex-row md:items-end justify-between border-b border-gray-200 pb-4 gap-4">
      <div>
        <h2 class="text-xl sm:text-2xl font-black uppercase tracking-tight text-gray-950">
          TRENDING FOOTWEAR
        </h2>
        <p class="text-xs text-gray-500 mt-1">
          Handpicked imported performance running &amp; lifestyle shoes
        </p>
      </div>

      <!-- Customer Interactive Filter Tabs -->
      <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
        <button class="bg-black text-white rounded-full px-4 py-1.5 text-xs font-bold shadow-xs">ALL</button>
        <button class="bg-neutral-100 text-neutral-600 hover:bg-neutral-200 rounded-full px-4 py-1.5 text-xs font-medium">IMPORTED</button>
        <button class="bg-neutral-100 text-neutral-600 hover:bg-neutral-200 rounded-full px-4 py-1.5 text-xs font-medium">TRENDING</button>
        <button class="bg-neutral-100 text-neutral-600 hover:bg-neutral-200 rounded-full px-4 py-1.5 text-xs font-medium">BEST SELLERS</button>
        <button class="bg-neutral-100 text-neutral-600 hover:bg-neutral-200 rounded-full px-4 py-1.5 text-xs font-medium">NEW ARRIVALS</button>
      </div>
    </div>

    <!-- PRODUCT GRID: 5 columns on desktop -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 max-w-7xl mx-auto">
      <!-- Card 1: Adidas 33 -->
      <div class="group relative bg-white border border-neutral-200 rounded-2xl p-4 w-full flex flex-col justify-between hover:border-black transition-all duration-300 shadow-2xs hover:shadow-md cursor-pointer">
        <div class="absolute top-2.5 left-2.5 right-2.5 z-10 flex items-center justify-between pointer-events-none">
          <div><span class="bg-rose-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider shadow-xs">SALE</span></div>
          <div><span class="bg-neutral-900 text-white text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider shadow-xs">50% OFF</span></div>
        </div>
        <div class="relative w-full aspect-[4/3] bg-white flex items-center justify-center overflow-hidden mb-2">
          <img src="http://localhost/athletica/uploads/products/prod-8-cd0d2d6a1c52869a.jpg" alt="Adidas 33" class="w-full h-full object-contain" />
        </div>
        <div class="flex flex-col items-center text-center">
          <span class="text-[10px] sm:text-[11px] font-bold text-neutral-400 uppercase tracking-wider mb-0.5 line-clamp-1">ADIDAS</span>
          <h3 class="text-xs sm:text-sm font-bold text-neutral-900 line-clamp-1 mb-1">Addidas 33</h3>
          <div class="flex items-center justify-center gap-1.5 sm:gap-2 mt-1 whitespace-nowrap">
            <span class="text-xs sm:text-sm font-extrabold text-neutral-900">Rs. 10,000.00</span>
            <span class="text-[10px] text-neutral-400 line-through font-normal">Rs. 20,000.00</span>
          </div>
        </div>
        <div class="w-full bg-black text-white text-xs font-bold py-2 rounded-lg text-center mt-2">SELECT OPTIONS →</div>
      </div>

      <!-- Card 2: Asics Gel-Kayano -->
      <div class="group relative bg-white border border-neutral-200 rounded-2xl p-4 w-full flex flex-col justify-between hover:border-black transition-all duration-300 shadow-2xs hover:shadow-md cursor-pointer">
        <div class="absolute top-2.5 left-2.5 right-2.5 z-10 flex items-center justify-between pointer-events-none">
          <div><span class="bg-rose-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider shadow-xs">SALE</span></div>
          <div><span class="bg-neutral-900 text-white text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider shadow-xs">20% OFF</span></div>
        </div>
        <div class="relative w-full aspect-[4/3] bg-white flex items-center justify-center overflow-hidden mb-2">
          <img src="http://localhost/athletica/uploads/products/prod-7-ed06b80854161bc5.png" alt="Asics" class="w-full h-full object-contain" />
        </div>
        <div class="flex flex-col items-center text-center">
          <span class="text-[10px] sm:text-[11px] font-bold text-neutral-400 uppercase tracking-wider mb-0.5 line-clamp-1">ASICS</span>
          <h3 class="text-xs sm:text-sm font-bold text-neutral-900 line-clamp-1 mb-1">Gel-Kayano 27</h3>
          <div class="flex items-center justify-center gap-1.5 sm:gap-2 mt-1 whitespace-nowrap">
            <span class="text-xs sm:text-sm font-extrabold text-neutral-900">Rs. 12,000.00</span>
            <span class="text-[10px] text-neutral-400 line-through font-normal">Rs. 15,000.00</span>
          </div>
        </div>
        <div class="w-full bg-black text-white text-xs font-bold py-2 rounded-lg text-center mt-2">SELECT OPTIONS →</div>
      </div>
    </div>

    <!-- VIEW MORE FOOTWEAR BUTTON -->
    <div class="pt-4 flex justify-center">
      <a href="/shop?category=shoes" class="inline-flex items-center gap-2 bg-black text-white hover:bg-neutral-800 text-xs sm:text-sm font-bold uppercase tracking-wider py-3 px-8 rounded-xl transition-all shadow-xs hover:shadow-md">
        <span>VIEW MORE FOOTWEAR</span>
        <span>→</span>
      </a>
    </div>
  </section>
</body>
</html>
